aid: listia
name: Listia
description: 'Listia is a peer-to-peer marketplace where members give away and acquire
  secondhand goods using an internal virtual currency ("Points") rather than cash.
  Launched in 2009 and backed by Andreessen Horowitz, the service lets members list
  unwanted items in auction-style listings, earn Points when an item sells, and spend
  those Points to claim items from other members — a closed-loop credit-and-reputation
  economy layered on a classic online-auction flow. The site reports over 10 million
  members, operates iOS and Android apps alongside the web marketplace, and runs adjacent
  programs including Listia Rewards (redeeming Points for gift cards and retail goods)
  and Listia Assurance (buyer and seller protection). Listia publishes no public developer
  program: there is no developer portal, no API documentation, no OpenAPI or other
  machine-readable specification, and no first-party SDKs on npm, PyPI, RubyGems or
  Packagist. The api.listia.com host serves the same Rails application as the website
  and acts as the private backend for the mobile apps, not a documented public API.'
